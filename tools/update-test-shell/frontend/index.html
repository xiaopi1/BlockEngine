<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>方块引擎更新验证</title>
		<style>
			:root { color-scheme: dark; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
			* { box-sizing: border-box; }
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f7f3e8; background: #101411; overflow: hidden; }
			body::before { content: ""; position: fixed; inset: 0; opacity: .24; background-image: linear-gradient(#4c654f 1px, transparent 1px), linear-gradient(90deg, #4c654f 1px, transparent 1px); background-size: 32px 32px; mask-image: linear-gradient(to bottom, #000, transparent); }
			main { position: relative; width: min(620px, calc(100vw - 56px)); padding: 36px; border: 1px solid #49604d; border-radius: 12px; background: linear-gradient(145deg, rgba(36, 47, 38, .96), rgba(20, 27, 22, .98)); box-shadow: 0 24px 80px #0009; }
			.brand { display: flex; align-items: center; gap: 14px; }
			.mark { width: 48px; height: 48px; display: grid; place-items: center; color: #142018; font-size: 25px; font-weight: 900; background: #e99332; clip-path: polygon(0 0, 78% 0, 100% 22%, 100% 100%, 22% 100%, 0 78%); }
			h1 { margin: 0; font-size: 22px; }
			.version { margin-top: 3px; color: #9eb0a1; font-size: 13px; letter-spacing: .08em; }
			.hero { margin: 44px 0 28px; }
			h2 { margin: 0 0 10px; font-size: 32px; line-height: 1.2; }
			#status { min-height: 48px; color: #bdc9bf; line-height: 1.7; }
			.track { height: 8px; overflow: hidden; border: 1px solid #56675a; background: #111612; }
			#bar { width: 8%; height: 100%; background: linear-gradient(90deg, #e99332, #f6bd55); transition: width .2s ease; }
			.controls { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
			.note { color: #809084; font-size: 12px; }
			button { padding: 10px 22px; border: 1px solid #edaa53; border-radius: 6px; color: #17130d; background: #f0a43c; font: inherit; font-weight: 700; cursor: pointer; }
			button:disabled { opacity: .55; cursor: wait; }
		</style>
	</head>
	<body>
		<main>
			<div class="brand"><div class="mark">BE</div><div><h1>方块引擎</h1><div class="version">BLOCKENGINE UPDATE TEST · 1.7.1</div></div></div>
			<section class="hero"><h2>验证正式更新链路</h2><div id="status">准备连接官方服务。检测到新版本后，将校验签名并自动安装。</div></section>
			<div class="track"><div id="bar"></div></div>
			<div class="controls"><span class="note">该程序不包含启动、账户或实例数据。</span><button id="retry">立即检测</button></div>
		</main>
		<script>
			const status = document.querySelector('#status')
			const bar = document.querySelector('#bar')
			const retry = document.querySelector('#retry')
			let running = false

			window.__TAURI__.event.listen('blockengine://update-progress', ({ payload }) => {
				status.textContent = payload.message
				if (payload.total) bar.style.width = `${Math.max(4, Math.min(100, payload.downloaded / payload.total * 100))}%`
				else if (payload.stage === 'checking') bar.style.width = '18%'
				else if (payload.stage === 'installing') bar.style.width = '100%'
				if (payload.stage === 'current') { running = false; retry.disabled = false }
			})

			async function run() {
				if (running) return
				running = true
				retry.disabled = true
				try {
					await window.__TAURI__.core.invoke('run_update_test')
				} catch (error) {
					status.textContent = `更新验证失败：${error}`
					bar.style.width = '4%'
					running = false
					retry.disabled = false
				}
			}

			retry.addEventListener('click', run)
			setTimeout(run, 500)
		</script>
	</body>
</html>
