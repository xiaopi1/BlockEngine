[package]
name = "tauri-plugin-window-state"
version = "2.4.1"
description = "Save window positions and sizes and restore them when the app is reopened."
authors = ["Tauri Programme within The Commons Conservancy"]
license = "MIT OR Apache-2.0"
edition = { workspace = true }
rust-version = { workspace = true }
repository = "https://github.com/Lintern/plugins-workspace"
links = "tauri-plugin-window-state"

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "none", notes = "" }
ios = { level = "none", notes = "" }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
log = "0.4"
thiserror = { workspace = true }
bitflags = "2"
